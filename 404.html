<!DOCTYPE html>
<html lang="en" translate="no">
    <head>
        <title data-pt="Página não encontrada">Page not found</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/assets/css/style.css" />
        <link rel="icon" sizes="16x16" href="/assets/icons/favicon.ico" type="image/x-icon">
        <link rel="icon" sizes="32x32" href="/assets/icons/favicon.ico" type="image/x-icon">
        <link rel="icon" sizes="192x192" href="/assets/img/Ana_Sa_Oliveira.png" type="image/x-icon">
        <link rel="icon" sizes="512x512" href="/assets/img/Ana_Sa_Oliveira.png" type="image/x-icon">
        <link rel="shortcut icon" href="/assets/icons/favicon.ico" type="image/x-icon">
        <meta name="google" content="notranslate">
        <script src="/assets/js/main.js" defer></script>
        <script>
            window.location.replace("/");

            (function () {
                const root = document.documentElement;
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme ? savedTheme === 'dark' : prefersDark) root.classList.add('dark-mode');
            })();
        </script>
    </head>
    <body>
        <button class="fab fab--theme fab--shadow" id="theme-toggle">🌙</button>
        <button class="fab fab--lang fab--shadow" id="lang-toggle">
            <img class="lang-icon" id="lang-icon">
        </button>
        <script>
            (function () {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme ? savedTheme === 'dark' : prefersDark) {
                    document.getElementById('theme-toggle').textContent = '☀️';
                }
            })();
        </script>
        <!-- Home -->
        <div id="home" class="section section--home section--gradient">
            <div class="section-inner w3-center">
                <div class="w3-container w3-content w3-margin">
                    <div class="w3-xxlarge w3-hide-small">
                        <b>
                            <div class="w3-text-pink">
                                404
                                <span data-pt="Página não encontrada">Page not found</span>
                                <br>
                                <br>
                            </div>
                            <a href="/index.html" data-pt="Voltar ao portefólio da Ana ♥" class="w3-button w3-hover-custom1 w3-round-large btn-back">
                                Go back to Ana's portfolio ♥
                            </a>
                        </b>
                    </div>
                    <div class="w3-xlarge w3-hide-medium w3-hide-large">
                        <b>
                            <div class="w3-text-pink">
                                404
                                <span data-pt="Página não encontrada">Page not found</span>
                                <br>
                                <br>
                            </div>
                            <a href="/index.html" data-pt="Voltar ao portefólio da Ana ♥" class="w3-button w3-hover-custom1 w3-round-large btn-back">
                                Go back to Ana's portfolio ♥
                            </a>
                        </b>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
